<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arxiv Məlumatlar</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f0f8ff;
      padding: 10px;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #007BFF;
      margin-bottom: 20px;
    }
    .filter {
      text-align: center;
      margin-bottom: 20px;
    }
    .filter input, .filter button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .filter button {
      background-color: #007BFF;
      color: white;
      cursor: pointer;
      border: none;
    }
    .filter button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #007BFF;
      color: white;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .action-buttons button {
      padding: 5px 10px;
      margin: 2px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }
    .edit-btn {
      background-color: #28a745;
    }
    .delete-btn {
      background-color: #dc3545;
    }
    @media (max-width: 768px) {
      table, thead, tbody, th, td {
        font-size: 13px;
      }
      .filter input, .filter button {
        font-size: 14px;
        width: 100%;
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Arxiv Məlumatlar</h2>

    <div class="filter">
      <input type="date" id="filterDate" onchange="filterByDate()" />
      <button onclick="exportToExcel()">Excel-ə göndər</button>
    </div>

    <table id="archiveTable">
      <thead>
        <tr>
          <th>Maşın</th>
          <th>Fermer</th>
          <th>1-ci növ</th>
          <th>2-ci növ</th>
          <th>3-cü növ</th>
          <th>Çəki (kg)</th>
          <th>Tarix</th>
          <th>Əməliyyat</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Excel üçün kitabxana -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    const archiveBinId = '685a8fe58960c979a5b0700f';
    const binId = '685a8fd78960c979a5b07001';
    const apiKey = '$2a$10$XvrFlhL9CyMhkVKRFP0lLuHH5sxWiXCFPHoJvUMzymRReiRqgGOTK';

    let allTemplates = [];

    async function fetchTemplates(bin) {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, {
        headers: { 'X-Master-Key': apiKey }
      });
      const data = await res.json();
      return data.record.templates || [];
    }

    async function saveTemplates(bin, templates) {
      await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': apiKey
        },
        body: JSON.stringify({ templates })
      });
    }

    async function loadArchive() {
      allTemplates = await fetchTemplates(archiveBinId);
      displayTemplates(allTemplates);
    }

    function displayTemplates(data) {
      const tbody = document.querySelector("#archiveTable tbody");
      tbody.innerHTML = '';

      data.forEach((item, index) => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td><input type="text" id="car-${index}" value="${item.carNumber}"></td>
          <td><input type="text" id="farmer-${index}" value="${item.farmer}"></td>
          <td><input type="text" id="type1-${index}" value="${item.type1}"></td>
          <td><input type="text" id="type2-${index}" value="${item.type2}"></td>
          <td><input type="text" id="type3-${index}" value="${item.type3}"></td>
          <td><input type="number" id="weight-${index}" value="${item.weight || ''}"></td>
          <td><input type="text" id="date-${index}" value="${item.date}" disabled></td>
          <td class="action-buttons">
            <button class="edit-btn" onclick="saveEdit(${index})">Yadda saxla</button>
            <button class="delete-btn" onclick="deleteRow(${index})">Sil</button>
          </td>
        `;
      });
    }

    async function saveEdit(index) {
      const updated = {
        carNumber: document.getElementById(`car-${index}`).value,
        farmer: document.getElementById(`farmer-${index}`).value,
        type1: document.getElementById(`type1-${index}`).value,
        type2: document.getElementById(`type2-${index}`).value,
        type3: document.getElementById(`type3-${index}`).value,
        weight: parseFloat(document.getElementById(`weight-${index}`).value),
        date: document.getElementById(`date-${index}`).value
      };

      // Güncəllə arxiv
      allTemplates[index] = updated;
      await saveTemplates(archiveBinId, allTemplates);

      // Güncəllə gündəlik bin də əgər varsa
      const daily = await fetchTemplates(binId);
      const match = daily.find(t =>
        t.carNumber === updated.carNumber &&
        t.date === updated.date
      );
      if (match) {
        Object.assign(match, updated);
        await saveTemplates(binId, daily);
      }

      alert("Dəyişiklik yadda saxlanıldı!");
    }

    async function deleteRow(index) {
      if (!confirm("Bu məlumatı silmək istədiyinizə əminsiniz?")) return;
      allTemplates.splice(index, 1);
      await saveTemplates(archiveBinId, allTemplates);
      loadArchive();
    }

    function filterByDate() {
      const selected = document.getElementById("filterDate").value;
      if (!selected) {
        displayTemplates(allTemplates);
        return;
      }
      const filtered = allTemplates.filter(item => item.date === selected);
      displayTemplates(filtered);
    }

    function exportToExcel() {
      const table = document.querySelector("#archiveTable");
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.table_to_sheet(table);
      XLSX.utils.book_append_sheet(wb, ws, "Arxiv");
      XLSX.writeFile(wb, "arxiv-melumatlari.xlsx");
    }

    window.onload = loadArchive;
  </script>
</body>
</html>
