<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arxiv</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #aec6ee 100%);
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 16px auto;
            padding: 16px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 17px;
            color: #007BFF;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 5px;
            overflow: hidden;
        }
        table, th, td {
            border: 1px solid #000000;
        }
        th, td {
            padding: 12px;
            text-align: left;
            font-size: 16px;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        .edit-button, .delete-button {
            padding: 5px 10px;
            font-size: 14px;
            color: white;
            border: none;
            cursor: pointer;
        }
        .edit-button {
            background-color: #28a745;
        }
        .delete-button {
            background-color: #dc3545;
        }
        .edit-button:hover {
            background-color: #218838;
        }
        .delete-button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arxiv</h1>
        <table id="archiveTable">
            <thead>
                <tr>
                    <th>Maşının nömrəsi</th>
                    <th>Fermer</th>
                    <th>1-ci növ</th>
                    <th>2-ci növ</th>
                    <th>3-cü növ</th>
                    <th>Çəki (kg)</th>
                    <th>Tarix</th>
                    <th>Əməliyyat</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const archiveBinId = '67b6d365acd3cb34a8e94722'; // Arxiv məlumatları üçün JSONBin ID
        const apiKey = '$2a$10$5wzTHgtC0vgrGwIENwkphON2Sp/F9WgLvBN/ZQOi.fUsRcdLcJfTO';

        async function fetchTemplates() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${archiveBinId}/latest`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': apiKey
                    }
                });
                const data = await response.json();
                return data.record.templates || [];
            } catch (error) {
                console.error("Məlumatları çəkmək mümkün olmadı:", error);
                return [];
            }
        }

        async function saveTemplates(templates) {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${archiveBinId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': apiKey
                    },
                    body: JSON.stringify({ templates })
                });
            } catch (error) {
                console.error("Məlumatları yadda saxlamaq mümkün olmadı:", error);
            }
        }

        async function loadArchive() {
            const templates = await fetchTemplates();
            displayTemplates(templates);
        }

        function displayTemplates(templates) {
            const tbody = document.getElementById('archiveTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = '';

            templates.forEach((template, index) => {
                const row = tbody.insertRow();
                row.insertCell().textContent = template.carNumber;
                row.insertCell().textContent = template.farmer;
                row.insertCell().textContent = template.type1;
                row.insertCell().textContent = template.type2;
                row.insertCell().textContent = template.type3;

                const weightCell = row.insertCell();
                weightCell.innerHTML = `
                    <input type="number" class="weight-input" id="weight-${index}" value="${template.weight || ''}" disabled>
                `;

                row.insertCell().textContent = template.date;

                const actionCell = row.insertCell();
                actionCell.innerHTML = `
                    <div class="action-buttons">
                        <button class="edit-button" onclick="enableEdit(${index})">Düzəliş et</button>
                        <button class="delete-button" onclick="deleteTemplate(${index})">Sil</button>
                    </div>
                `;

                row.dataset.index = index;
            });
        }

        function enableEdit(index) {
            const weightInput = document.getElementById(`weight-${index}`);
            weightInput.disabled = false;
            weightInput.focus();

            weightInput.addEventListener('blur', async () => {
                await updateWeight(index, weightInput.value);
                weightInput.disabled = true;
            });
        }

        async function updateWeight(index, newWeight) {
            if (!newWeight) return;

            const templates = await fetchTemplates();
            templates[index].weight = parseFloat(newWeight);

            await saveTemplates(templates);
        }

        async function deleteTemplate(index) {
            if (!confirm('Bu məlumatı silmək istədiyinizə əminsiniz?')) return;

            const templates = await fetchTemplates();
            templates.splice(index, 1);

            await saveTemplates(templates);
            loadArchive();
        }

        window.onload = loadArchive;
    </script>
</body>
</html>
