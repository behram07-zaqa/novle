<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arxiv</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #aec6ee 100%);
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #007BFF;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #eef5ff;
        }
        input {
            width: 100%;
            padding: 6px;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .edit-button, .delete-button {
            padding: 6px 12px;
            font-size: 14px;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .edit-button {
            background-color: #28a745;
        }
        .delete-button {
            background-color: #dc3545;
        }
        .edit-button:hover {
            background-color: #218838;
        }
        .delete-button:hover {
            background-color: #c82333;
        }
        @media (max-width: 768px) {
            table, th, td {
                font-size: 12px;
                padding: 8px;
            }
            input {
                font-size: 12px;
            }
            .edit-button, .delete-button {
                font-size: 12px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arxiv</h1>
        <table id="archiveTable">
            <thead>
                <tr>
                    <th>Maşının nömrəsi</th>
                    <th>Fermer</th>
                    <th>1-ci növ</th>
                    <th>2-ci növ</th>
                    <th>3-cü növ</th>
                    <th>Çəki (kg)</th>
                    <th>Tarix</th>
                    <th>Əməliyyat</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const archiveBinId = '67b6d365acd3cb34a8e94722'; // Arxiv məlumatları üçün JSONBin ID
        const apiKey = '$2a$10$5wzTHgtC0vgrGwIENwkphON2Sp/F9WgLvBN/ZQOi.fUsRcdLcJfTO';

        async function fetchTemplates() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${archiveBinId}/latest`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': apiKey
                    }
                });
                const data = await response.json();
                return data.record.templates || [];
            } catch (error) {
                console.error("Məlumatları çəkmək mümkün olmadı:", error);
                return [];
            }
        }

        async function saveTemplates(templates) {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${archiveBinId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': apiKey
                    },
                    body: JSON.stringify({ templates })
                });
            } catch (error) {
                console.error("Məlumatları yadda saxlamaq mümkün olmadı:", error);
            }
        }

        async function loadArchive() {
            const templates = await fetchTemplates();
            displayTemplates(templates);
        }

        function displayTemplates(templates) {
            const tbody = document.getElementById('archiveTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = '';

            templates.forEach((template, index) => {
                const row = tbody.insertRow();

                const fields = ["carNumber", "farmer", "type1", "type2", "type3", "weight"];
                
                fields.forEach((field, i) => {
    const cell = row.insertCell(i);
    const value = template[field] || '';

    if (field === 'weight') {
        cell.innerHTML = `<input type="number" class="edit-input" style="font-weight:bold;" id="${field}-${index}" value="${value}" disabled>`;
    } else {
        cell.innerHTML = `<input type="text" class="edit-input" id="${field}-${index}" value="${value}" disabled>`;
    }
});


                row.insertCell().textContent = template.date;

                const actionCell = row.insertCell();
                actionCell.innerHTML = `
                    <div class="action-buttons">
                        <button class="edit-button" onclick="enableEdit(${index})">Düzəliş et</button>
                        <button class="delete-button" onclick="deleteTemplate(${index})">Sil</button>
                    </div>
                `;

                row.dataset.index = index;
            });
        }

        function enableEdit(index) {
            const fields = ["carNumber", "farmer", "type1", "type2", "type3", "weight"];

            fields.forEach(field => {
                const input = document.getElementById(`${field}-${index}`);
                input.disabled = false;
                input.focus();

                input.addEventListener('blur', async () => {
                    await updateTemplate(index);
                    input.disabled = true;
                });
            });
        }

        async function updateTemplate(index) {
            const fields = ["carNumber", "farmer", "type1", "type2", "type3", "weight"];
            const templates = await fetchTemplates();

            fields.forEach(field => {
                const input = document.getElementById(`${field}-${index}`);
                templates[index][field] = input.value;
            });

            await saveTemplates(templates);
        }

        async function deleteTemplate(index) {
            if (!confirm('Bu məlumatı silmək istədiyinizə əminsiniz?')) return;

            const templates = await fetchTemplates();
            templates.splice(index, 1);

            await saveTemplates(templates);
            loadArchive();
        }

        window.onload = loadArchive;
    </script>
</body>
</html>
