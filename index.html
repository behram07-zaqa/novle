<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Məlumat Əlavə Et</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #a6c0fe, #f68084);
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    h2 {
      text-align: center;
      color: #007BFF;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #007BFF;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #eee;
      text-align: center;
      font-size: 15px;
    }
    th {
      background-color: #007BFF;
      color: white;
    }
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      input, button {
        font-size: 15px;
      }
      th, td {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Yeni Məlumat Əlavə Et</h2>

    <div class="input-group">
      <label for="carNumber">Maşın nömrəsi</label>
      <input type="text" id="carNumber" placeholder="99-AA-123">
    </div>
    <div class="input-group">
      <label for="farmer">Fermer</label>
      <input type="text" id="farmer" placeholder="Fermer adı">
    </div>
    <div class="input-group">
      <label for="type1">1-ci növ</label>
      <input type="text" id="type1" placeholder="Növ 1">
    </div>
    <div class="input-group">
      <label for="type2">2-ci növ</label>
      <input type="text" id="type2" placeholder="Növ 2">
    </div>
    <div class="input-group">
      <label for="type3">3-cü növ</label>
      <input type="text" id="type3" placeholder="Növ 3">
    </div>

    <button onclick="addTemplate()">Yadda saxla</button>

    <table id="templateTable">
      <thead>
        <tr>
          <th>Maşın</th>
          <th>Fermer</th>
          <th>1-ci növ</th>
          <th>2-ci növ</th>
          <th>3-cü növ</th>
          <th>Tarix</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const binId = '685a8fd78960c979a5b07001';
    const archiveBinId = '685a8fe58960c979a5b0700f';
    const apiKey = '$2a$10$XvrFlhL9CyMhkVKRFP0lLuHH5sxWiXCFPHoJvUMzymRReiRqgGOTK';

    async function fetchTemplates(bin) {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, {
        headers: { 'X-Master-Key': apiKey }
      });
      const data = await res.json();
      return data.record.templates || [];
    }

    async function saveTemplates(bin, templates) {
      await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': apiKey
        },
        body: JSON.stringify({ templates })
      });
    }

    async function addTemplate() {
      const carNumber = document.getElementById('carNumber').value.trim();
      const farmer = document.getElementById('farmer').value.trim();
      const type1 = document.getElementById('type1').value.trim();
      const type2 = document.getElementById('type2').value.trim();
      const type3 = document.getElementById('type3').value.trim();

      if (!carNumber || !farmer || !type1 || !type2 || !type3) {
        alert("Bütün sahələri doldurun!");
        return;
      }

      const today = new Date().toLocaleDateString('en-CA');
      const newData = { carNumber, farmer, type1, type2, type3, date: today };

      const daily = await fetchTemplates(binId);
      const archive = await fetchTemplates(archiveBinId);

      daily.push(newData);
      archive.push(newData);

      await saveTemplates(binId, daily);
      await saveTemplates(archiveBinId, archive);

      displayTemplates(daily);
      document.querySelectorAll('input').forEach(i => i.value = '');
    }

    function displayTemplates(templates) {
      const tbody = document.querySelector("#templateTable tbody");
      tbody.innerHTML = '';
      templates.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.carNumber}</td>
          <td>${item.farmer}</td>
          <td>${item.type1}</td>
          <td>${item.type2}</td>
          <td>${item.type3}</td>
          <td>${item.date}</td>
        `;
        tbody.appendChild(row);
      });
    }

    window.onload = async () => {
      const today = new Date().toLocaleDateString('en-CA');
      const daily = await fetchTemplates(binId);

      if (daily.length > 0 && daily[0].date !== today) {
        await saveTemplates(binId, []);
        displayTemplates([]);
      } else {
        displayTemplates(daily);
      }
    };
  </script>
</body>
</html>
