<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Çəki Hesabatı</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f0f8ff;
      padding: 10px;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #007BFF;
      margin-bottom: 15px;
    }
    .filter {
      text-align: center;
      margin-bottom: 20px;
    }
    .filter input {
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border: 1px solid #eee;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #007BFF;
      color: white;
    }
    input[type="number"] {
      width: 80px;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .save-button {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .save-button:hover {
      background: #218838;
    }
    .total-weight {
      margin-top: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #007BFF;
    }
    @media (max-width: 768px) {
      th, td {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Çəki Hesabatı</h2>

    <div class="filter">
      <input type="date" id="filterDate" onchange="filterByDate()" />
      <button onclick="clearFilter()">Hamısını göstər</button>
    </div>

    <div class="total-weight" id="totalWeight">Ümumi Çəki: 0 kg</div>

    <table id="reportTable">
      <thead>
        <tr>
          <th>Maşın</th>
          <th>Fermer</th>
          <th>1-ci növ</th>
          <th>2-ci növ</th>
          <th>3-cü növ</th>
          <th>Çəki (kg)</th>
          <th>Tarix</th>
          <th>Əməliyyat</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const archiveBinId = '685a8fe58960c979a5b0700f';
    const apiKey = '$2a$10$XvrFlhL9CyMhkVKRFP0lLuHH5sxWiXCFPHoJvUMzymRReiRqgGOTK';
    let allTemplates = [];

    async function fetchTemplates() {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${archiveBinId}/latest`, {
        headers: { 'X-Master-Key': apiKey }
      });
      const data = await res.json();
      return data.record.templates || [];
    }

    async function saveTemplates(templates) {
      await fetch(`https://api.jsonbin.io/v3/b/${archiveBinId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': apiKey
        },
        body: JSON.stringify({ templates })
      });
    }

    async function loadReport() {
      allTemplates = await fetchTemplates();
      displayTemplates(allTemplates);
    }

    function displayTemplates(data) {
      const tbody = document.querySelector("#reportTable tbody");
      tbody.innerHTML = '';
      let total = 0;

      data.forEach((item, index) => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td>${item.carNumber}</td>
          <td>${item.farmer}</td>
          <td>${item.type1}</td>
          <td>${item.type2}</td>
          <td>${item.type3}</td>
          <td>
            <input type="number" id="weight-${index}" value="${item.weight || ''}" ${item.weight ? 'disabled' : ''}>
          </td>
          <td>${item.date}</td>
          <td>
            ${item.weight ? '✔️' : `<button class="save-button" onclick="saveWeight(${index})">Yadda saxla</button>`}
          </td>
        `;

        total += parseFloat(item.weight || 0);
      });

      document.getElementById('totalWeight').innerText = `Ümumi Çəki: ${total.toFixed(1)} kg`;
    }

    async function saveWeight(index) {
      const weightInput = document.getElementById(`weight-${index}`);
      const weight = parseFloat(weightInput.value);

      if (!weight) {
        alert("Zəhmət olmasa çəkini daxil edin.");
        return;
      }

      allTemplates[index].weight = weight;
      await saveTemplates(allTemplates);
      loadReport();
    }

    function filterByDate() {
      const date = document.getElementById("filterDate").value;
      if (!date) return;
      const filtered = allTemplates.filter(t => t.date === date);
      displayTemplates(filtered);
    }

    function clearFilter() {
      document.getElementById("filterDate").value = '';
      displayTemplates(allTemplates);
    }

    window.onload = loadReport;
  </script>
</body>
</html>
